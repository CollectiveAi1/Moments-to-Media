name: CI

on:
  pull_request:
  # Every branch, not just main: the tests are the gate on this work, and a
  # branch should go red before it reaches a pull request.
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Schema, RLS and state-machine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots Postgres and applies every file in supabase/migrations in order.
      - name: Start local Supabase
        run: supabase start

      # Fails if a migration is not reproducible from scratch.
      - name: Reset database from migrations
        run: supabase db reset

      # The TAP output is echoed as workflow error annotations as well as to
      # the log, because run logs need a signed-in session with write access
      # while annotations are readable from the run's API without one.
      - name: Run pgTAP tests (RLS policies and state machines)
        run: |
          set +e
          supabase test db 2>&1 | tee /tmp/tap.txt
          status=${PIPESTATUS[0]}
          # Always report the size of the run, pass or fail.
          grep -E '^(Files=|Result:)' /tmp/tap.txt \
            | while IFS= read -r line; do echo "::notice::${line}"; done
          if [ "$status" -ne 0 ]; then
            {
              echo '### pgTAP output'
              echo '```'
              cat /tmp/tap.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -nE '(ERROR|FATAL|PANIC|^not ok|# +Failed test|# +died:|# +caught:|#   +(have|want|error|description):|# Looks like|Parse errors)' /tmp/tap.txt \
              | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            tail -5 /tmp/tap.txt | while IFS= read -r line; do echo "::error::tail: ${line}"; done
          fi
          exit "$status"

      # Errors only. The linter flags security-definer views, which are
      # deliberate here — see docs/foundation-review.md.
      - name: Lint schema
        run: supabase db lint --level error

  functions:
    name: Edge Functions (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Supabase Edge Functions are Deno, and nothing else in this repo can
      # check them: the pgTAP job never loads them and the Node job does not
      # see supabase/functions. Without this they would ship unverified.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        working-directory: supabase/functions
        run: deno check **/*.ts

      - name: Lint
        working-directory: supabase/functions
        run: deno lint

      - name: Format
        working-directory: supabase/functions
        run: deno fmt --check

      # The R2 calls need a bucket; these cover the pure logic around them —
      # key encoding, the completion XML, the 200-with-error-body case, which
      # parts get signed, and that no failure path leaks a secret.
      - name: Unit tests
        working-directory: supabase/functions
        run: deno test --allow-env

  node:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      # No `cache: pnpm` until a lockfile is committed: the cache step fails
      # outright when it cannot find pnpm-lock.yaml.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # TODO: switch to --frozen-lockfile once pnpm-lock.yaml is committed
      # (needs one `pnpm install` on a machine with a working Node toolchain).
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
