project_id = "moments-to-media"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Passwordless only: magic link by email, OTP by SMS (PRD "Architecture and stack").
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = true

# Role claims in the access token (20261112000900_access_token_hook.sql).
# RLS does not read these — see that migration's header.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/custom_access_token"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(TWILIO_AUTH_TOKEN)"

[storage]
enabled = true
file_size_limit = "50MiB"
